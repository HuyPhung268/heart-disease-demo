# Giao diện dùng chung cho cả hai chế độ sáng/tối.
# primaryColor dùng slot 1 của bảng màu đã kiểm định trong src/theme.py
# (#3987e5) để widget của Streamlit đồng bộ với màu biểu đồ.
# Người dùng chuyển chế độ ở menu ☰ -> Settings -> Appearance.
[theme]
font = "sans serif"
baseRadius = "0.7rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#3987e5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
borderColor = "#E2E8F0"
linkColor = "#3987e5"

[theme.light.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#E2E8F0"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#111A2E"
textColor = "#E2E8F0"
borderColor = "#1E293B"
linkColor = "#3987e5"

[theme.dark.sidebar]
backgroundColor = "#080D18"
secondaryBackgroundColor = "#111A2E"
borderColor = "#1E293B"

[server]
headless = true

[browser]
gatherUsageStats = false
