# Giao diện dùng chung cho cả hai chế độ sáng/tối.
# Người dùng chuyển chế độ ở menu ☰ -> Settings -> Appearance.
[theme]
font = "sans serif"
baseRadius = "0.7rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#0D9488"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
borderColor = "#E2E8F0"
linkColor = "#0D9488"

[theme.light.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#E2E8F0"

[theme.dark]
primaryColor = "#2DD4BF"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#111A2E"
textColor = "#E2E8F0"
borderColor = "#1E293B"
linkColor = "#2DD4BF"

[theme.dark.sidebar]
backgroundColor = "#080D18"
secondaryBackgroundColor = "#111A2E"
borderColor = "#1E293B"

[server]
headless = true

[browser]
gatherUsageStats = false
