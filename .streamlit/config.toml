# Shared look and feel for both light and dark mode.
# primaryColor uses slot 1 of the validated palette in src/theme.py (#3987e5)
# so Streamlit's own widgets match the chart colours.
# Users switch mode from the menu -> Settings -> Appearance.
[theme]
font = "sans serif"
baseRadius = "0.7rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#3987e5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
borderColor = "#E2E8F0"
linkColor = "#3987e5"

[theme.light.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#E2E8F0"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#111A2E"
textColor = "#E2E8F0"
borderColor = "#1E293B"
linkColor = "#3987e5"

[theme.dark.sidebar]
backgroundColor = "#080D18"
secondaryBackgroundColor = "#111A2E"
borderColor = "#1E293B"

[server]
headless = true

[browser]
gatherUsageStats = false
